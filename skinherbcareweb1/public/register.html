<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนสมาชิก - SkinHerbCare</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(160deg, #e0f2f1, #dcfce7);
        }
        
        /* 🌿 Background decoration */
        body::before, body::after {
            position: fixed;
            z-index: -1;
            opacity: 0.35;
        }
        body::before {
            content: "🌿";
            bottom: -60px;
            left: -60px;
            font-size: 260px;
            transform: rotate(-25deg);
        }
        body::after {
            content: "🌿";
            top: -80px;
            right: -80px;
            font-size: 300px;
            transform: rotate(20deg);
        }
        
        .password-mismatch {
            border-color: #ef4444 !important;
            background-color: #fef2f2;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen px-4 py-6">

    <div class="w-full max-w-lg bg-white rounded-xl shadow-xl p-6 sm:p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-bold text-green-800">🌿 ลงทะเบียนสมาชิก</h1>
            <p class="text-gray-500 mt-2 text-sm sm:text-base">
                สร้างบัญชีเพื่อเริ่มต้นใช้งาน SkinHerbCare
            </p>
        </div>

        <form id="registerForm" class="space-y-4">

            <!-- ชื่อ / นามสกุล -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold mb-1">ชื่อ</label>
                    <input id="firstName" type="text" required
                        class="w-full px-4 py-2 rounded-lg border bg-gray-50 focus:border-green-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">นามสกุล</label>
                    <input id="lastName" type="text" required
                        class="w-full px-4 py-2 rounded-lg border bg-gray-50 focus:border-green-500 focus:outline-none">
                </div>
            </div>

            <!-- อายุ / อาชีพ -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold mb-1">อายุ</label>
                    <input id="age" type="number" min="1" required
                        class="w-full px-4 py-2 rounded-lg border bg-gray-50 focus:border-green-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">อาชีพ</label>
                    <input id="occupation" type="text" required
                        class="w-full px-4 py-2 rounded-lg border bg-gray-50 focus:border-green-500 focus:outline-none">
                </div>
            </div>

            <!-- Email -->
            <div>
                <label class="block text-sm font-bold mb-1">อีเมล</label>
                <input id="email" type="email" required
                    class="w-full px-4 py-2 rounded-lg border bg-gray-50 focus:border-green-500 focus:outline-none">
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-bold mb-1">รหัสผ่าน</label>
                <input id="password" type="password" required
                    class="w-full px-4 py-2 rounded-lg border bg-gray-50 focus:border-green-500 focus:outline-none">
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block text-sm font-bold mb-1">ยืนยันรหัสผ่าน</label>
                <input id="confirmPassword" type="password" required
                    class="w-full px-4 py-2 rounded-lg border bg-gray-50 focus:border-green-500 focus:outline-none">
                <p id="passwordError" class="hidden text-red-500 text-xs mt-1 font-bold">
                    ❌ รหัสผ่านไม่ตรงกัน
                </p>
            </div>

            <!-- Server error -->
            <div id="serverError"
                class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded text-center text-sm">
            </div>

            <button id="submitBtn" type="submit"
                class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition">
                ลงทะเบียน
            </button>
        </form>

        <div class="text-center mt-6 text-sm">
            มีบัญชีอยู่แล้ว?
            <a href="/login.html" class="font-bold text-green-600 hover:underline">
                เข้าสู่ระบบ
            </a>
        </div>
    </div>

<script>
const API_BASE_URL = 'https://skinherbcareweb1.onrender.com'; // ✅ Backend URL

document.addEventListener('DOMContentLoaded', () => {

    const form = document.getElementById('registerForm');
    const firstName = document.getElementById('firstName');
    const lastName = document.getElementById('lastName');
    const age = document.getElementById('age');
    const occupation = document.getElementById('occupation');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const passwordError = document.getElementById('passwordError');
    const serverError = document.getElementById('serverError');
    const submitBtn = document.getElementById('submitBtn');

    function validatePassword() {
        if (password.value !== confirmPassword.value && confirmPassword.value !== '') {
            confirmPassword.classList.add('password-mismatch');
            passwordError.classList.remove('hidden');
            return false;
        }
        confirmPassword.classList.remove('password-mismatch');
        passwordError.classList.add('hidden');
        return true;
    }

    password.addEventListener('input', validatePassword);
    confirmPassword.addEventListener('input', validatePassword);

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        serverError.classList.add('hidden');

        if (!validatePassword()) return;

        submitBtn.disabled = true;
        submitBtn.innerText = 'กำลังบันทึกข้อมูล...';

        try {
            const response = await fetch(`${API_BASE_URL}/api/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    firstName: firstName.value.trim(),
                    lastName: lastName.value.trim(),
                    age: parseInt(age.value),
                    occupation: occupation.value.trim(),
                    email: email.value.trim(),
                    password: password.value
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || 'สมัครสมาชิกไม่สำเร็จ');
            }

            alert('✅ สมัครสมาชิกสำเร็จ');
            window.location.href = '/login.html';

        } catch (err) {
            serverError.textContent = err.message;
            serverError.classList.remove('hidden');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'ลงทะเบียน';
        }
    });
});
</script>

</body>
</html>
